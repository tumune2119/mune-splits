# Builds the phone versions of MUNE Splits from the on-device build (scripts/build-local.mjs):
#  - android: signed APK, attached to the GitHub release for tags (v*) and kept as a workflow artifact
#  - ios:     compiles the iOS app for the simulator (proves the Xcode project builds; App Store
#             distribution needs an Apple Developer account and is done from a Mac)
#  - pages:   the installable web app (iPhone/Android "Add to Home Screen") on GitHub Pages
name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: node scripts/build-local.mjs
      - run: npx cap sync android
      - name: Build signed APK
        env:
          MUNE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MUNE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUNE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUNE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$MUNE_KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$MUNE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export MUNE_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/MUNE-Splits-$VERSION-android.apk"
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Check the APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs release/*.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MUNE Splits ${TAG#v}" --notes "See the README for install steps."
          gh release upload "$TAG" release/*.apk --clobber

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-local.mjs
      - run: npx cap sync ios
      - name: Compile for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  pages-build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-local.mjs --base /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
